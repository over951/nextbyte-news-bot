
name: NEXTBYTE News Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: nextbyte-news
  cancel-in-progress: false

jobs:
  collect-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run NEXTBYTE news bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Save seen stories
        run: |
          git config user.name "NEXTBYTE Bot"
          git config user.email "nextbyte-bot@users.noreply.github.com"

          git add seen.json

          if ! git diff --cached --quiet; then
            git commit -m "Update seen news"
          fi

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
